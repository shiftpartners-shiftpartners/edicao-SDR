name: SDR media machine tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_records.py templates/creative-ledger.example.jsonl --schema schemas/creative-variant.schema.json
      - run: python scripts/validate_records.py templates/performance-observations.example.jsonl --schema schemas/performance-observation.schema.json
      - run: python scripts/diversity_check.py templates/creative-ledger.example.jsonl
      - run: python scripts/edp_to_render_plan.py templates/edit-plan.example.yaml --out /tmp/plan.json && cat /tmp/plan.json
      - run: printf 'Sabe por que esse arroz não queima? A panela de barro segura o calor.' > /tmp/fala.txt && python scripts/caption_segments.py /tmp/fala.txt --out /tmp/legenda.json && cat /tmp/legenda.json
